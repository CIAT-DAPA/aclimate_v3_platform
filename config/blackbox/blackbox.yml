# AClimate v3 — Blackbox exporter configuration
# Probes HTTP endpoints of every service for availability/latency checks
modules:
  http_2xx:
    prober: http
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      follow_redirects: true
      preferred_ip_protocol: "ip4"