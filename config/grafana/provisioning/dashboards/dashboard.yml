# AClimate v3 — Grafana dashboard provisioning
# Each provider maps a folder to a subdirectory of the dashboards mount
apiVersion: 1

providers:
  # Infrastructure — host & container metrics
  - name: 'Infrastructure'
    orgId: 1
    folder: 'Infrastructure'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/infrastructure

  # Application — service status & availability
  - name: 'Application'
    orgId: 1
    folder: 'Application'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/application

  # Database — PostgreSQL metrics
  - name: 'Database'
    orgId: 1
    folder: 'Database'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/database

  # Authentication — Keycloak metrics
  - name: 'Authentication'
    orgId: 1
    folder: 'Authentication'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/authentication

  # Logs — Loki log exploration
  - name: 'Logs'
    orgId: 1
    folder: 'Logs'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/logs