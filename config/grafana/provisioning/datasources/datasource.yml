# AClimate v3 — Grafana datasources provisioning
# Auto-registers Prometheus and Loki datasources on Grafana startup.
# UIDs are fixed so dashboards can reference them reliably.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false