# AClimate v3 — Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Keycloak metrics (management port 9000)
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  # Service health probes (blackbox — uptime & response time of each service)
  - job_name: health_checks
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://webapi:3002/health
        labels:
          service: webapi
      - targets:
          - http://frontend:3000/api/health
        labels:
          service: frontend
      - targets:
          - http://keycloak:8080/realms/aclimate
        labels:
          service: keycloak
      - targets:
          - http://admin:3003/health
        labels:
          service: admin
      - targets:
          - http://users-api:3004/health
        labels:
          service: users-api
      - targets:
          - http://geoserver:8080/geoserver/web/
        labels:
          service: geoserver
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Node Exporter — host metrics (CPU, RAM, disk, network, uptime)
  - job_name: node_exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: aclimate-host

  # cAdvisor — per-container metrics (CPU, RAM, network I/O, disk I/O)
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          job: container-metrics

  # PostgreSQL Exporter — database metrics
  - job_name: postgres
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          db: aclimate_db